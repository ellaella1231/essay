<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Essay Master Demo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, className }) => {
      useEffect(() => {
        lucide.createIcons();
      });
      return <i data-lucide={name} className={className}></i>;
    };

    const LoginPage = ({ onLogin }) => {
      const [phone, setPhone] = useState("");
      const [otp, setOtp] = useState("1234");
      const [error, setError] = useState("");

      const handleLogin = (e) => {
        e.preventDefault();
        if (otp === "1234") {
          onLogin();
        } else {
          setError("Invalid OTP");
        }
      };

      return (
        <div className="flex min-h-screen items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
          <div className="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
            <div className="mb-8 text-center">
              <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
              <p className="mt-2 text-sm text-slate-500">Sign in to AI Essay Master Demo</p>
            </div>
            <form onSubmit={handleLogin} className="space-y-6">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">Phone Number (+86)</label>
                <div className="relative rounded-xl shadow-sm border border-slate-300 overflow-hidden flex items-center bg-white">
                  <div className="pl-3 pr-2 text-slate-400">
                    <Icon name="phone" className="h-5 w-5" />
                  </div>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="+8613800138000"
                    className="flex-1 py-3 outline-none text-slate-900"
                  />
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">OTP (Try 1234)</label>
                <div className="relative rounded-xl shadow-sm border border-slate-300 overflow-hidden flex items-center bg-white">
                  <div className="pl-3 pr-2 text-slate-400">
                    <Icon name="lock" className="h-5 w-5" />
                  </div>
                  <input
                    type="text"
                    value={otp}
                    onChange={(e) => setOtp(e.target.value)}
                    className="flex-1 py-3 outline-none text-slate-900"
                  />
                </div>
              </div>
              {error && <p className="text-sm text-red-500">{error}</p>}
              <button type="submit" className="w-full bg-blue-600 text-white rounded-xl py-3 font-semibold shadow hover:bg-blue-500 transition-colors flex justify-center items-center gap-2">
                <Icon name="log-in" className="h-5 w-5" /> Sign in
              </button>
            </form>
          </div>
        </div>
      );
    };

    const HomePage = ({ onUpload }) => {
      const [isUploading, setIsUploading] = useState(false);
      const [file, setFile] = useState(null);
      const [base64Image, setBase64Image] = useState(null);

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        if (selectedFile) {
          setFile(selectedFile);
          const reader = new FileReader();
          reader.onloadend = () => {
            setBase64Image(reader.result);
          };
          reader.readAsDataURL(selectedFile);
        }
      };

      const handleUpload = async () => {
        if (!base64Image) return;
        setIsUploading(true);
        try {
          const res = await fetch('/api/grade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Image, prompt: "" })
          });
          const data = await res.json();
          setIsUploading(false);
          if (data.error) {
            alert(data.error);
          } else {
            onUpload(data);
          }
        } catch (err) {
          setIsUploading(false);
          alert("Upload failed: " + err);
        }
      };

      return (
        <div className="min-h-screen pb-20 max-w-lg mx-auto">
          <header className="bg-white px-6 py-4 shadow-sm sticky top-0 z-10 flex items-center gap-2">
            <Icon name="book-open" className="text-blue-600 h-6 w-6" />
            <h1 className="text-xl font-bold text-slate-900">AI Essay Master</h1>
          </header>
          <main className="p-4 space-y-6">
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
              <h2 className="text-lg font-semibold text-slate-900 mb-4">Grade Level</h2>
              <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 ring-blue-600">
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>High School</option>
              </select>
            </div>
            
            <div className="relative group cursor-pointer">
              <input type="file" accept="image/*" onChange={handleFileChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
              <div className={`border-2 border-dashed rounded-3xl p-10 flex flex-col items-center justify-center transition-colors ${file ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-white hover:bg-slate-50'}`}>
                <Icon name="camera" className={`h-12 w-12 mb-4 ${file ? 'text-blue-500' : 'text-slate-400'}`} />
                <span className={`text-sm font-medium ${file ? 'text-blue-700' : 'text-slate-600'}`}>
                  {file ? file.name : "Tap to select photo"}
                </span>
              </div>
            </div>

            <button
              onClick={handleUpload}
              disabled={!file || isUploading}
              className="w-full flex items-center justify-center gap-2 bg-blue-600 text-white rounded-2xl py-4 font-semibold text-lg shadow-lg disabled:opacity-50 transition-all"
            >
              {isUploading ? "AI is correcting..." : <><Icon name="upload" className="h-5 w-5" /> Upload & Grade</>}
            </button>
          </main>
        </div>
      );
    };

    const ResultPage = ({ onBack, result }) => {
      const [showPerfect, setShowPerfect] = useState(true);
      const errors = result.errors || [];

      return (
        <div className="min-h-screen pb-10 max-w-lg mx-auto">
          <header className="bg-white px-4 py-4 shadow-sm sticky top-0 z-10 flex items-center gap-4">
            <button onClick={onBack} className="p-2 rounded-full hover:bg-slate-100">
              <Icon name="chevron-left" className="h-6 w-6" />
            </button>
            <h1 className="text-xl font-bold">Grading Result</h1>
          </header>

          <main className="px-4 py-6 space-y-6">
            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-8 text-center text-white shadow-lg">
              <h2 className="text-blue-100 font-medium">Final Score</h2>
              <div className="text-6xl font-black mt-2">{result.score || 0}</div>
            </div>

            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
              <div className="flex bg-slate-100 rounded-xl p-1 mb-6">
                <button onClick={() => setShowPerfect(false)} className={`flex-1 py-2 rounded-lg text-sm font-semibold ${!showPerfect ? 'bg-white shadow' : 'text-slate-500'}`}>Original</button>
                <button onClick={() => setShowPerfect(true)} className={`flex-1 py-2 rounded-lg text-sm font-semibold ${showPerfect ? 'bg-blue-600 shadow text-white' : 'text-slate-500'}`}>Perfect</button>
              </div>
              <div className="text-lg text-slate-700 whitespace-pre-wrap">
                {showPerfect ? result.perfect_essay : result.original_text}
              </div>
            </div>

            <div>
              <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="book-open" className="h-5 w-5 text-blue-600" /> Corrections</h3>
              <div className="space-y-4">
                {errors.map((err, idx) => (
                  <div key={idx} className="bg-white rounded-2xl p-5 shadow-sm border border-red-100">
                    <div className="mb-2"><span className="text-red-600 font-medium line-through mr-2">{err.original_segment}</span></div>
                    <div className="mb-2"><span className="text-green-600 font-bold">{err.suggested_segment}</span></div>
                    <div className="text-sm text-slate-600 pt-2 border-t border-slate-100 mt-2">💡 {err.explanation}</div>
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    };

    const App = () => {
      const [view, setView] = useState("login");
      const [result, setResult] = useState(null);

      if (view === "login") return <LoginPage onLogin={() => setView("home")} />;
      if (view === "home") return <HomePage onUpload={(data) => { setResult(data); setView("result"); }} />;
      if (view === "result") return <ResultPage onBack={() => setView("home")} result={result} />;
      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
